; Production PHP settings for the HAT image.
; The base php image ships php.ini-production but never activates it, leaving
; PHP's compiled-in defaults - including display_errors=On, which leaks absolute
; paths to the browser before Symfony's error handler takes over.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

; Doctrine hydrates timestamps without an explicit timezone, and they are stored
; as UTC wall time. The kernel pins this too; setting it here keeps CLI one-liners
; and any non-kernel entrypoint consistent.
date.timezone = UTC

memory_limit = 256M

; Without OPcache every request re-parses the whole framework and vendor tree.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a built image, so stat() calls per include are
; pure overhead. A new image means a new container, hence a fresh OPcache.
opcache.validate_timestamps = 0
